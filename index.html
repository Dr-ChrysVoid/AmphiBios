<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Blood Circulation – NCERT Class 11</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body {
  background: #0f1117;
  font-family: 'Source Sans 3', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 16px 10px 32px;
}

h1 {
  font-family: 'Crimson Pro', serif;
  font-size: 1.6rem;
  font-weight: 600;
  color: #e8e0d0;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
  text-align: center;
}
.subtitle {
  font-size: 0.78rem;
  color: #6b7280;
  margin-bottom: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
}

#svg-wrap {
  border: 1px solid #2a2d3a;
  border-radius: 10px;
  background: #111318;
  box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px #1e2130;
  overflow: hidden;
  max-width: 100%;
}

#controls {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 8px 20px;
  border: 1px solid transparent;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.18s;
  text-transform: uppercase;
}
button:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.3; cursor: not-allowed; }

#btn-collect { background: #1e3a8a; color: #bfdbfe; border-color: #3b5fc0; }
#btn-mix     { background: #4c1d95; color: #ddd6fe; border-color: #7c3aed; }
#btn-pump    { background: #7f1d1d; color: #fecaca; border-color: #dc2626; }
#btn-reset   { background: #1f2937; color: #9ca3af; border-color: #374151; }


#status-bar {
  margin-top: 10px;
  font-size: 0.78rem;
  color: #6b7280;
  min-height: 16px;
  text-align: center;
  font-style: italic;
  letter-spacing: 0.02em;
}


/* ── Organ blood-fill flash ── */
@keyframes fillBlue {
  0%   { opacity: 0; }
  20%  { opacity: 0.55; }
  70%  { opacity: 0.45; }
  100% { opacity: 0; }
}
@keyframes fillRed {
  0%   { opacity: 0; }
  20%  { opacity: 0.55; }
  70%  { opacity: 0.45; }
  100% { opacity: 0; }
}
@keyframes fillPurple {
  0%   { opacity: 0; }
  20%  { opacity: 0.55; }
  70%  { opacity: 0.45; }
  100% { opacity: 0; }
}
.organ-flash-blue   { animation: fillBlue   1.4s ease-out forwards; pointer-events: none; }
.organ-flash-red    { animation: fillRed    1.4s ease-out forwards; pointer-events: none; }
.organ-flash-purple { animation: fillPurple 1.4s ease-out forwards; pointer-events: none; }

/* ── Info Panel ── */
#info-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.92);
  width: min(420px, 90vw);
  background: #161820;
  border: 1px solid #2a2d3a;
  border-radius: 12px;
  padding: 24px 26px 20px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 0 1px #252836;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
#info-panel.visible {
  opacity: 1;
  pointer-events: all;
  transform: translate(-50%, -50%) scale(1);
}
#info-panel-close {
  position: absolute;
  top: 12px; right: 14px;
  background: none; border: none;
  color: #6b7280; font-size: 1.2rem; cursor: pointer;
  padding: 2px 6px; border-radius: 4px;
  transition: color 0.15s, background 0.15s;
}
#info-panel-close:hover { color: #e5e7eb; background: #252836; }
#info-panel-icon {
  font-size: 2rem; margin-bottom: 8px; display: block;
}
#info-panel-title {
  font-family: 'Crimson Pro', serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: #e8e0d0;
  margin-bottom: 4px;
}
#info-panel-type {
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 600;
}
#info-panel-desc {
  font-size: 0.88rem;
  color: #9ca3af;
  line-height: 1.65;
  margin-bottom: 14px;
}
#info-panel-facts {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#info-panel-facts li {
  font-size: 0.8rem;
  color: #6b7280;
  padding: 6px 10px;
  background: #1e2130;
  border-radius: 6px;
  border-left: 3px solid #374151;
  line-height: 1.5;
}
#info-panel-facts li strong {
  color: #d1d5db;
  display: block;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 1px;
}
#info-panel-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}
#info-panel-backdrop.visible { opacity: 1; pointer-events: all; }

.clickable { cursor: pointer; }
.clickable:hover { filter: brightness(1.3) drop-shadow(0 0 6px currentColor); transition: filter 0.18s; }

/* Vessel layers — z-order controlled by SVG group order */
.vmajor, .vminor { transition: filter 0.18s; }

/* ── Speed slider ── */
#speed-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-top: 10px; justify-content: center;
}
#speed-wrap label { font-size: 0.74rem; color: #6b7280; letter-spacing: 0.04em; text-transform: uppercase; }
#speed-slider {
  -webkit-appearance: none; appearance: none;
  width: 130px; height: 4px; border-radius: 2px;
  background: linear-gradient(to right, #a855f7, #3b82f6);
  outline: none; cursor: pointer;
}
#speed-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: #e9d5ff; border: 2px solid #a855f7; cursor: pointer;
}
#speed-val { font-size: 0.74rem; color: #9ca3af; min-width: 28px; }

/* ── Auto-cycle button ── */
#btn-auto { background: #14532d; color: #86efac; border-color: #16a34a; }
#btn-auto.active { background: #166534; box-shadow: 0 0 10px #16a34a66; }

/* ── Heartbeat pulse on ventricle ── */
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  14%      { transform: scale(1.06); }
  28%      { transform: scale(0.98); }
  42%      { transform: scale(1.05); }
  70%      { transform: scale(1); }
}
.beating { animation: heartbeat 1.1s ease-in-out infinite; transform-origin: 500px 382px; }

/* ── Vessel hover tooltip ── */
#vessel-tip {
  position: fixed;
  background: #1e2130;
  border: 1px solid #374151;
  border-radius: 6px;
  padding: 5px 11px;
  font-size: 0.74rem;
  color: #d1d5db;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 500;
  white-space: nowrap;
}

/* ── Info panel accent bar ── */
#info-panel-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  border-radius: 12px 12px 0 0;
}

/* ── Tab navigation inside info panel ── */
#info-tabs {
  display: flex; gap: 0; margin-bottom: 14px;
  border-bottom: 1px solid #2a2d3a;
}
.info-tab {
  font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
  font-weight: 600; color: #4b5563; padding: 6px 14px;
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.info-tab.active { color: #e9d5ff; border-bottom-color: #a855f7; }

#tab-content-facts, #tab-content-compare { display: none; }
#tab-content-facts.active, #tab-content-compare.active { display: block; }

#info-panel-compare {
  font-size: 0.8rem; color: #6b7280; line-height: 1.65;
  padding: 8px 10px; background: #1e2130; border-radius: 6px;
}
#info-panel-compare strong { color: #d1d5db; display: block; margin-bottom: 4px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>

<p class="subtitle">Amphibian Cardiovascular System &mdash; Class 11 Biology</p>

<div id="svg-wrap">
<svg id="main-svg" width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Radial gradients for chambers -->
  <radialGradient id="gRA" cx="40%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#3b6fd4"/><stop offset="100%" stop-color="#1e3a8a"/>
  </radialGradient>
  <radialGradient id="gLA" cx="60%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#e05252"/><stop offset="100%" stop-color="#991b1b"/>
  </radialGradient>
  <radialGradient id="gVent" cx="50%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#9b5de5"/><stop offset="100%" stop-color="#5b21b6"/>
  </radialGradient>
  <radialGradient id="gSinus" cx="40%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#1e3a8a"/>
  </radialGradient>
  <radialGradient id="gConus" cx="50%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6d28d9"/>
  </radialGradient>
  <radialGradient id="gLung" cx="40%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#2d1f1f"/><stop offset="100%" stop-color="#1a1010"/>
  </radialGradient>
  <radialGradient id="gBody" cx="50%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#292018"/><stop offset="100%" stop-color="#1a1208"/>
  </radialGradient>
  <linearGradient id="gSkin" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a3320"/><stop offset="100%" stop-color="#0d1f12"/>
  </linearGradient>
  <linearGradient id="gVessel_blue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/>
  </linearGradient>

  <!-- Glows -->
  <filter id="glow-blue" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-purple" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <filter id="glow-chamber" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Arrow markers: fixed userSpace size, tip exactly at path endpoint -->
  <marker id="aBlue" markerWidth="12" markerHeight="8"
          refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 12 4, 0 8" fill="#3b82f6" opacity="0.95"/>
  </marker>
  <marker id="aRed" markerWidth="12" markerHeight="8"
          refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 12 4, 0 8" fill="#ef4444" opacity="0.95"/>
  </marker>
  <marker id="aPurple" markerWidth="12" markerHeight="8"
          refX="12" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <polygon points="0 0, 12 4, 0 8" fill="#a855f7" opacity="0.95"/>
  </marker>

  <!-- Clip paths for chambers -->
  <clipPath id="clipRA">
    <ellipse cx="453" cy="310" rx="46" ry="35"/>
  </clipPath>
  <clipPath id="clipLA">
    <ellipse cx="549" cy="310" rx="46" ry="35"/>
  </clipPath>
  <clipPath id="clipVent">
    <path d="M500,328 C532,328 576,350 576,382 C576,413 543,435 500,435 C457,435 424,413 424,382 C424,350 468,328 500,328Z"/>
  </clipPath>
</defs>

<!-- ══════════════════════════════════════════════════════ -->
<!--  VESSEL LAYER 1 — MINOR / BACKGROUND vessels        -->
<!--  (behind organs; low opacity; dashed where secondary) -->
<!-- ══════════════════════════════════════════════════════ -->
<g id="vessels-minor">
  <!-- Minor vessels removed for clarity; main flow paths are shown in vessels-major -->
</g>

<!-- ══════════════════════════════════════════════════════ -->
<!--  VESSEL LAYER 2 — MAJOR vessels                      -->
<!--  (rendered above organs and minor vessels)            -->
<!-- ══════════════════════════════════════════════════════ -->
<g id="vessels-major">

  <!--
    HOLLOW TUBE STYLE: Each vessel = 3 stacked paths sharing same 'd':
      1. Outer edge A (colored, dashed, wide)
      2. Dark fill (background color, solid, narrower) — creates the hollow interior
      3. Outer edge B = same as A but the interactive hit-target (invisible, wide for hover)
    The "tube" effect: colored dashed outer stroke + dark solid inner stroke on same path.
    The interactive path (id, class, data-*) uses stroke="transparent" for event capture.
  -->

  <!-- ── DEOXYGENATED (BLUE) ── -->

// Build a label group: pill + text in SVG coords
function makeSvgLabel(id, labelText, lx, ly, color) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('id', 'lbl-' + id);
  g.setAttribute('opacity', '0');
  g.style.transition = 'opacity 0.2s';
  g.style.pointerEvents = 'none';

  const PADDING = 8, H = 18;
  // Measure approximate text width (7px per char is fine for SVG)
  const W = labelText.length * 6.2 + PADDING * 2;
  // Keep label inside SVG bounds
  let rx = Math.min(Math.max(lx, W/2 + 4), 1000 - W/2 - 4);
  let ry = Math.max(ly, 14);

  // Leader dot
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', lx); dot.setAttribute('cy', ly);
  dot.setAttribute('r', '3'); dot.setAttribute('fill', color);
  g.appendChild(dot);

  // Leader line from dot to pill
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', lx); line.setAttribute('y1', ly);
  line.setAttribute('x2', rx); line.setAttribute('y2', ry - H/2 - 2);
  line.setAttribute('stroke', color); line.setAttribute('stroke-width', '1');
  line.setAttribute('stroke-dasharray', '3,2'); line.setAttribute('opacity', '0.6');
  g.appendChild(line);

  // Pill background
  const pill = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  pill.setAttribute('x', rx - W/2); pill.setAttribute('y', ry - H);
  pill.setAttribute('width', W); pill.setAttribute('height', H);
  pill.setAttribute('rx', H/2); pill.setAttribute('ry', H/2);
  pill.setAttribute('fill', '#12141c');
  pill.setAttribute('stroke', color); pill.setAttribute('stroke-width', '1');
  pill.setAttribute('opacity', '0.95');
  g.appendChild(pill);

  // Text
  const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  txt.setAttribute('x', rx); txt.setAttribute('y', ry - H/2 + 4.5);
  txt.setAttribute('text-anchor', 'middle');
  txt.setAttribute('font-family', "'Source Sans 3', sans-serif");
  txt.setAttribute('font-size', '10'); txt.setAttribute('font-weight', '600');
  txt.setAttribute('fill', color); txt.setAttribute('letter-spacing', '0.04em');
  txt.textContent = labelText;
  g.appendChild(txt);

  return g;
}

// Cache of built labels
const labelCache = {};

function showVesselLabel(el, animate) {
  const id    = el.id;
  const ltext = el.dataset.label;
  const lx    = parseFloat(el.dataset.lx);
  const ly    = parseFloat(el.dataset.ly);
  const color = el.dataset.color || '#e9d5ff';
  if (!ltext || !id) return;

  // Hide any other label
  if (activeLabelId && activeLabelId !== id) hideVesselLabel(activeLabelId);

  if (!labelCache[id]) {
    const g = makeSvgLabel(id, ltext, lx, ly, color);
    labelLayer.appendChild(g);
    labelCache[id] = g;
  }
  // Force reflow before setting opacity for transition
  requestAnimationFrame(() => { labelCache[id].setAttribute('opacity','1'); });
  activeLabelId = id;
}

function hideVesselLabel(id) {
  const key = id || activeLabelId;
  if (key && labelCache[key]) {
    labelCache[key].setAttribute('opacity','0');
  }
  if (!id) activeLabelId = null;
}

function makeSvgCircle(r, fill, glowColor) {
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  // glow halo
  const halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
  halo.setAttribute('r', r * 2.2);
  halo.setAttribute('fill', glowColor || fill);
  halo.setAttribute('opacity','0.22');
  g.appendChild(halo);
  // core
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('r', r);
  c.setAttribute('fill', fill);
  c.setAttribute('opacity','0.95');
  g.appendChild(c);
  g.setAttribute('visibility','hidden');
  layer.appendChild(g);
  return { g, c, halo };
}

function removeSvgElem(el) {
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function pathPoint(pts, t) {
  if (t <= 0) return { x: pts[0][0], y: pts[0][1] };
  if (t >= 1) return { x: pts[pts.length-1][0], y: pts[pts.length-1][1] };
  let segs = [], total = 0;
  for (let i = 0; i < pts.length-1; i++) {
    const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1];
    const d=Math.sqrt(dx*dx+dy*dy); segs.push(d); total+=d;
  }
  let dist = t * total;
  for (let i = 0; i < segs.length; i++) {
    if (dist <= segs[i]) {
      const u = dist/segs[i];
      return { x:pts[i][0]+u*(pts[i+1][0]-pts[i][0]), y:pts[i][1]+u*(pts[i+1][1]-pts[i][1]) };
    }
    dist -= segs[i];
  }
  return { x:pts[pts.length-1][0], y:pts[pts.length-1][1] };
}

class Particle {
  constructor(path, fill, glow, r=5, delay=0) {
    this.path  = path;
    this.t     = 0;
    this.delay = delay;
    this.done  = false;
    this.svgObjs = makeSvgCircle(r, fill, glow);
  }
  update(speed) {
    if (this.delay > 0) { this.delay--; return; }
    this.svgObjs.g.setAttribute('visibility','visible');
    if (this.done) return;
    this.t += speed;
    if (this.t >= 1) { this.t = 1; this.done = true; }
    const pos = pathPoint(this.path, this.t);
    this.svgObjs.g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
  }
  destroy() { removeSvgElem(this.svgObjs.g); }
}

function clearParticles() {
  activeParticles.forEach(p => p.destroy());
  activeParticles = [];
}
function stopAnim() {
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
}

function sampleCubic(x0,y0,cx1,cy1,cx2,cy2,x1,y1,n){const pts=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;const x=u*u*u*x0+3*u*u*t*cx1+3*u*t*t*cx2+t*t*t*x1;const y=u*u*u*y0+3*u*u*t*cy1+3*u*t*t*cy2+t*t*t*y1;pts.push([x,y]);}return pts;}
const pathSystL=(()=>{const s1=sampleCubic(471,140,344,118,68,108,40,304,28);const s2=sampleCubic(40,304,16,460,190,506,394,503,28);return [...s1,...s2.slice(1)];})();
const pathSystR=(()=>{const s1=sampleCubic(529,140,656,118,932,108,960,304,28);const s2=sampleCubic(960,304,984,460,810,506,606,503,28);return [...s1,...s2.slice(1)];})();
const pathPulmL       = [[500,148],[471,167],[420,210],[348,222],[278,224],[244,224],[224,230],[198,245]];
const pathPulmR       = [[500,148],[529,167],[580,210],[652,222],[722,224],[756,224],[776,230],[802,245]];


// ── Animation runners ─────────────────────────
function runParticles(streams, onDone) {
  function loop() {
    streams.forEach(p => p.update(p._speed));
    if (streams.every(p => p.done)) { if(onDone) onDone(); return; }
    animFrameId = requestAnimationFrame(loop);
  }
  animFrameId = requestAnimationFrame(loop);
}

function spawnStream(pathArr, fill, glow, count, speedBase, delayMult) {
  const ps = [];
  pathArr.forEach((path, pi) => {
    for (let i = 0; i < count; i++) {
      const p = new Particle(path, fill, glow, 5.5, pi * delayMult + i * 4);
      p._speed = (speedBase + Math.random() * 0.003) * speedMult;
      activeParticles.push(p); ps.push(p);
    }
  });
  return ps;
}


// ── Organ fill flash ──────────────────────────
function flashOrgan(id, colorClass, delay=0) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('organ-flash-blue','organ-flash-red','organ-flash-purple');
    void el.offsetWidth; // reflow to restart animation
    el.classList.add(colorClass);
    el.addEventListener('animationend', () => el.classList.remove(colorClass), {once:true});
  }, delay);
}

// ── Buttons ───────────────────────────────────
function doCollect(onDone) {
  clearParticles();
  setStatus('Collecting — deoxygenated blood → Right Atrium; oxygenated blood → Left Atrium…');
  const bluePaths = [pathBodySinus, pathPrecavalL, pathPrecavalR];
  const redPaths  = [pathLeftLungLA, pathRightLungLA];
  const blue = spawnStream(bluePaths, '#3b82f6', '#1d4ed8', 9, 0.008, 12);
  const red  = spawnStream(redPaths,  '#ef4444', '#dc2626', 8, 0.008, 10);
  // Flash sinus/RA when blue arrives (~1.1s), flash LA when red arrives (~1.0s)
  const travelMs = Math.round(1000 / ((0.008 * 1.0) * 60));
  setTimeout(() => { flashOrgan('flash-sinus','organ-flash-blue'); flashOrgan('flash-ra','organ-flash-blue', 200); }, travelMs);
  setTimeout(() => { flashOrgan('flash-la','organ-flash-red'); }, travelMs - 100);
  runParticles([...blue,...red], onDone);
}

function doMix(onDone) {
  clearParticles();
  setStatus('Mixing — both atria contract, sending blood into the single ventricle…');
  const mixMs = Math.round(600 / ((0.013 * 1.0) * 60));
  setTimeout(() => flashOrgan('flash-vent','organ-flash-purple'), mixMs);
  const all = [];
  for (let i=0;i<10;i++){const p=new Particle(pathRAVent,'#3b82f6','#1d4ed8',5.5,i*4);p._speed=(0.013+Math.random()*0.004)*speedMult;activeParticles.push(p);all.push(p);}
  for (let i=0;i<10;i++){const p=new Particle(pathLAVent,'#ef4444','#dc2626',5.5,i*4);p._speed=(0.013+Math.random()*0.004)*speedMult;activeParticles.push(p);all.push(p);}
  let purpleSpawned=false;
  function loop(){
    all.forEach(p=>p.update(p._speed));
    if(!purpleSpawned&&all.filter(p=>p.done).length>=all.length*0.55){
      purpleSpawned=true;
      for(let i=0;i<12;i++){const angle=(i/12)*Math.PI*2;const sw=[];for(let s=0;s<=24;s++){const a=angle+(s/24)*Math.PI*2;sw.push([500+Math.cos(a)*34,382+Math.sin(a)*23]);}const sp=new Particle(sw,'#a855f7','#7c3aed',6,i*3);sp._speed=0.025*speedMult;activeParticles.push(sp);all.push(sp);}
    }
    if(all.every(p=>p.done)){if(onDone)onDone();return;}
    animFrameId=requestAnimationFrame(loop);
  }
  animFrameId=requestAnimationFrame(loop);
}

function doPump(onDone) {
  clearParticles();
  setStatus('Pumping — ventricle contracts → Conus → three arches → body / lungs / skin…');
  const outPaths=[pathVentConus,pathSystL,pathSystR,pathPulmL,pathPulmR];
  // Flash destinations: lungs ~0.9s, body ~1.2s
  const base = Math.round(900 / ((0.007 * 1.0) * 60));
  
  setTimeout(() => { flashOrgan('flash-lungL','organ-flash-purple'); flashOrgan('flash-lungR','organ-flash-purple'); }, base + 300);
  setTimeout(() => { flashOrgan('flash-body-top','organ-flash-purple'); flashOrgan('flash-body-bot','organ-flash-purple'); }, base + 600);
  runParticles(spawnStream(outPaths,'#a855f7','#7c3aed',8,0.007,10), onDone);
}

btnCollect.addEventListener('click', () => {
  if (statePhase !== 'idle') return;
  statePhase = 'collecting'; lockBtns();
  doCollect(() => { statePhase='collected'; setStatus('✓ Blood collected. Press ② Mix.'); unlockBtns(); });
});

btnMix.addEventListener('click', () => {
  if (statePhase !== 'collected' && statePhase !== 'idle') return;
  statePhase = 'mixing'; lockBtns();
  doMix(() => { statePhase='mixed'; setStatus('✓ Blood mixed. Press ③ Pump.'); unlockBtns(); });
});

btnPump.addEventListener('click', () => {
  if (statePhase !== 'mixed' && statePhase !== 'idle') return;
  statePhase = 'pumping'; lockBtns();
  doPump(() => { statePhase='pumped'; setStatus('✓ Cycle complete — blood distributed. Press ↺ Reset or ⟳ Auto.'); unlockBtns(); });
});

btnReset.addEventListener('click', () => {
  autoCycling = false;
  btnAuto.classList.remove('active');
  btnAuto.textContent = '⟳ Auto';
  stopAnim(); clearParticles(); statePhase='idle';
  setStatus('Press ① Collect to start, or ⟳ Auto for continuous cycle.');
  unlockBtns();
});

// ── Auto-cycle ──────────────────────────────
function runAutoCycle() {
  if (!autoCycling) return;
  statePhase='collecting'; lockBtns(); btnAuto.disabled=false;
  setStatus('⟳ Auto — Collecting…');
  doCollect(() => {
    if (!autoCycling) { statePhase='collected'; unlockBtns(); return; }
    setStatus('⟳ Auto — Mixing…');
    doMix(() => {
      if (!autoCycling) { statePhase='mixed'; unlockBtns(); return; }
      setStatus('⟳ Auto — Pumping…');
      doPump(() => {
        if (!autoCycling) { statePhase='pumped'; unlockBtns(); return; }
        setStatus('⟳ Auto cycling… (press ⟳ Auto again or ↺ Reset to stop)');
        clearParticles();
        setTimeout(runAutoCycle, 600);
      });
    });
  });
}

btnAuto.addEventListener('click', () => {
  autoCycling = !autoCycling;
  if (autoCycling) {
    btnAuto.classList.add('active');
    btnAuto.textContent = '⏹ Stop';
    stopAnim(); statePhase='idle';
    runAutoCycle();
  } else {
    btnAuto.classList.remove('active');
    btnAuto.textContent = '⟳ Auto';
    stopAnim(); clearParticles(); statePhase='idle';
    setStatus('Auto stopped. Press ① Collect to restart manually.');
    unlockBtns();
  }
});
</script>
